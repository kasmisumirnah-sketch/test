<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helix Jump - 20,000 Levels</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 9999;
      transition: opacity 0.5s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading h1 {
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    #loading p {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #controls {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
      max-width: 300px;
      z-index: 1000;
    }

    #controls h3 {
      margin-bottom: 10px;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      padding-bottom: 5px;
    }

    #controls div {
      margin: 5px 0;
      line-height: 1.4;
    }

    #controls kbd {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <h1>Helix Jump</h1>
    <p>20,000 Levels</p>
    <div class="spinner"></div>
  </div>

  <!-- Controls help -->
  <div id="controls">
    <h3>Controls</h3>
    <div><kbd>A</kbd> / <kbd>D</kbd> Rotate tower</div>
    <div><kbd>W</kbd> / <kbd>S</kbd> Zoom camera</div>
    <div><kbd>[</kbd> / <kbd>]</kbd> Move 1 level</div>
    <div><kbd>#</kbd> / <kbd>$</kbd> Move 10 levels</div>
    <div><kbd>(</kbd> / <kbd>)</kbd> Move 100 levels</div>
    <div><kbd>.</kbd> / <kbd>,</kbd> Move 1000 levels</div>
  </div>

  <!-- Main script -->
  <script type="module" src="/src/main.js"></script>

  <script>
    // Hide loading screen after a short delay
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
      }, 1000);
    });
  </script>
</body>
</html>
